[project]
name = "neuroimaging-cafn"
version = "2.0.0"
description = "Cross-Attention Fusion Network (CAFN) for multimodal neuroimaging: 3D structural MRI + 1D visual evoked potentials for vision-defect classification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BCSE497J Project" }]
keywords = ["neuroimaging", "multimodal-fusion", "cross-attention", "mri", "vep", "medical-imaging"]

dependencies = [
    "numpy>=1.26,<3",
    "torch>=2.4,<3",
    "monai>=1.3,<2",
    "nibabel>=5.0,<6",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
    "matplotlib>=3.8,<4",
]

# Electrophysiology and neuroimaging analysis extras; used by data
# exploration notebooks and MNE-format I/O, not by the core pipeline.
[project.optional-dependencies]
neuro = ["mne>=1.6,<2", "nilearn>=0.10,<1"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8"]

# Pytest/coverage configuration lives in pytest.ini (single source of truth
# for test discovery); this file only pins the dependency set.
